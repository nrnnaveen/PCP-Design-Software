<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Precision CAD Dark Board Surface with 1px border -->
  <rect x="1" y="1" width="30" height="30" rx="3" fill="#141518" stroke="#333742" stroke-width="1" />
  
  <!-- Subtle CAD Corner Guides -->
  <path d="M3 6H5 M6 3V5 M26 3V5 M27 6H29 M3 26H5 M6 27V29 M26 29V27 M27 26H29" stroke="#6b7280" stroke-width="0.75" stroke-opacity="0.35" />

  <!-- Copper Trace Path "F" with 45° dogleg -->
  <path d="M9 25V8H23M9 16H19L22 19" stroke="#0078d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Annular Via Ring (Top Right) -->
  <circle cx="23" cy="8" r="3" fill="#0078d4" />
  <circle cx="23" cy="8" r="1.2" fill="#141518" />

  <!-- Annular Via Ring (Mid Spur) -->
  <circle cx="22" cy="19" r="2.5" fill="#0078d4" />
  <circle cx="22" cy="19" r="1" fill="#141518" />

  <!-- Terminal Solder Pad (Bottom) -->
  <rect x="7.25" y="23.5" width="3.5" height="3.5" rx="0.75" fill="#0078d4" />
</svg>
